<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f2a1e">
<title>Task Manager | Finance Division — USC</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f2a1e;
    font-family: Arial, sans-serif;
  }
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f2a1e;
    color: #fff;
    z-index: 2;
    transition: opacity 0.3s ease;
  }
  #loader video {
    width: 220px;
    max-width: 60vw;
    height: auto;
    margin-bottom: 14px;
  }
  #loader .loader-label {
    font-size: 13px;
    letter-spacing: .02em;
    color: rgba(255,255,255,0.75);
  }
  #app-frame {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
  }
</style>
</head>
<body>

  <div id="loader">
    <video id="loader-video" autoplay muted loop playsinline>
      <source src="loading.mp4" type="video/mp4">
    </video>
    <div class="loader-label">Loading Task Manager…</div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/a/macros/usc.edu.ph/s/AKfycbzuzeuwOG7V923-ZTBx980szouNZiyTbDFGcb3XnGKOwdfFmbefVf0ZL5vz__SzA0zq/exec"
    title="Task Manager | Finance Division"
    allow="clipboard-write"
    onload="document.getElementById('loader').style.opacity='0'; setTimeout(function(){
      var l = document.getElementById('loader');
      l.style.display='none';
      var v = document.getElementById('loader-video');
      if (v) v.pause();
    }, 300);">
  </iframe>

</body>
</html>
